# Render Blueprint — deploys the whole app (backend API, frontend static
# site, and a Postgres database) from one file. In the Render dashboard:
# New > Blueprint > connect this repo > Apply.
#
# Free tier caveats (see the deployment notes in README.md):
#  - the free Postgres database expires 30 days after creation and must be
#    recreated (losing its data) to keep going for free;
#  - the free web service spins down after 15 minutes idle (the first
#    request after that takes ~30-50s to wake it back up);
#  - the free web service also only has 512MB RAM and a small ephemeral
#    disk, so with the AWS_* vars below left unset, uploaded admission
#    documents/photos land on that local disk and are lost on every
#    redeploy (and can fail under memory/disk pressure). Setting them
#    switches uploads to an S3-compatible bucket instead — see
#    README.md#deploying-it-for-real for setup steps. They're left with no
#    `value`/`generateValue` here (Render will prompt for them when you
#    Apply this blueprint, or you can fill them in from the dashboard
#    afterwards under the backend service's Environment tab).
databases:
  - name: anyschool-db
    plan: free
    databaseName: anyschool
    user: anyschool

services:
  - name: anyschool-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: anyschool-backend-0hbm.onrender.com
      - key: CORS_EXTRA_ORIGINS
        value: https://anyschool-frontend-6c22.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: anyschool-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://anyschool-frontend-6c22.onrender.com
      # Optional: point uploads at an S3-compatible bucket instead of the
      # backend's own ephemeral disk (see caveats above). Leave all four
      # unset to keep the default local-disk behavior.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false

  - name: anyschool-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
