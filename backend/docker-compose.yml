version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: university_portal_db
    environment:
      POSTGRES_DB: university_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: university_portal_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/university_portal
      - SECRET_KEY=django-insecure-zz@wl^vz&29xf!@qvc-f43)sge^qz*ry6jfkn=e4ik7q@7hpf^
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    networks:
      - university_network

  redis:
    image: redis:7-alpine
    container_name: university_portal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - university_network

  nginx:
    image: nginx:alpine
    container_name: university_portal_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - university_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  university_network:
    driver: bridge